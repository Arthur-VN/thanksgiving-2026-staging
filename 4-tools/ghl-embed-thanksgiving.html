<!--
  DMI Thanksgiving 2026: GoHighLevel embed.
  Paste everything below into ONE "Custom JS/HTML" element on an empty funnel step
  (no header/footer sections). The landing covers the whole screen and scrolls inside the frame.
  - Ad / email parameters on the GHL page URL (utm_source, utm_campaign, fbclid...) are passed to the landing,
    so leads in GHL keep their source.
  - The landing and the checkout stay inside the frame; the payment page and other sites open in the full tab.
  - Change PAGE below if the landing moves.
-->
<style>
  html, body { margin: 0 !important; height: 100% !important; overflow: hidden !important; }
  #dmi-tg-frame {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
    border: 0; margin: 0; padding: 0; z-index: 2147483000; background: #0A1222; display: block;
  }
</style>
<iframe id="dmi-tg-frame" title="Thanksgiving Website Sale 2026 | Detailers Movement"
  allow="autoplay; fullscreen; clipboard-write" allowfullscreen></iframe>
<script>
(function () {
  var PAGE = 'https://blackfriday2026.detailersmovement.com/thanksgiving';
  // phones lay out a page without a viewport tag at 980px, which would show the desktop layout inside the frame
  if (!document.querySelector('meta[name="viewport"]')) {
    var m = document.createElement('meta'); m.name = 'viewport'; m.content = 'width=device-width,initial-scale=1,viewport-fit=cover';
    document.head.appendChild(m);
  }
  var src = new URL(PAGE);
  new URLSearchParams(window.location.search).forEach(function (v, k) { src.searchParams.set(k, v); });
  document.getElementById('dmi-tg-frame').src = src.toString();
})();
</script>
